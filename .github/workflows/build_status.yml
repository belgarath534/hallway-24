name: Build status

# Asks App Store Connect what happened to the newest builds: VALID (in TestFlight), PROCESSING, or INVALID
# (Apple found a problem; the reason is in the email Apple sends to the developer account).
on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      CERTS_REPO_TOKEN: ${{ secrets.CERTS_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Clean token
        run: |
          CLEAN=$(printf '%s' "$CERTS_REPO_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN"
          echo "CLEAN_CERTS_TOKEN=$CLEAN" >> "$GITHUB_ENV"

      - name: Get key files from ios-certificates
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: belgarath534/ios-certificates
          token: ${{ env.CLEAN_CERTS_TOKEN }}
          path: .certs-repo

      - name: Collect Apple API keys
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.asc/candidates"
          if [ -d .certs-repo ]; then
            find .certs-repo -name '*.p8' -not -path '*/.git/*' -exec cp {} "$HOME/.asc/candidates/" \;
          fi
          if [ -n "$ASC_KEY_P8" ] && [ -n "$ASC_KEY_ID" ]; then
            printf '%s\n' "$ASC_KEY_P8" > "$HOME/.asc/candidates/secret_$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]').p8"
          fi
          rm -rf .certs-repo

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Find the key Apple accepts
        run: ruby scripts/check_asc_key.rb

      - name: Newest builds
        run: |
          export APP_STORE_CONNECT_ISSUER_ID=$ASC_ISSUER_ID
          export APP_STORE_CONNECT_KEY_IDENTIFIER=$GOOD_KEY_ID
          export APP_STORE_CONNECT_PRIVATE_KEY=@file:$ASC_KEY_PATH
          python3 -m pip install --quiet pyjwt cryptography requests
          python3 store/build_status.py

      - name: Remove keys
        if: always()
        run: rm -rf "$HOME/.asc"
