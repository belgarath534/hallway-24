name: Hallway 24

# Every push: the game's tests on Linux (including the robot player) and an unsigned iPhone build.
# TestFlight: Actions tab, Hallway 24, Run workflow. Uses the same secrets and certificates as the other games.
on:
  push:
  workflow_dispatch:

jobs:
  core-tests:
    name: Game tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Run HallwayCore tests
        working-directory: Packages/HallwayCore
        run: swift test

  ios-build:
    name: iPhone build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned app for iPhone
        run: |
          set -o pipefail
          xcodebuild \
            -project Hallway24.xcodeproj \
            -scheme Hallway24 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

  testflight:
    # Only when started by hand: Actions tab, Hallway 24, Run workflow.
    name: Upload to TestFlight
    needs: [core-tests, ios-build]
    runs-on: macos-15
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch'
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      CERTS_REPO_TOKEN: ${{ secrets.CERTS_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=0
          for name in MATCH_PASSWORD CERTS_REPO_TOKEN ASC_ISSUER_ID; do
            if [ -n "${!name}" ]; then echo "✅ $name is set"; else echo "❌ $name is missing (Settings, Secrets and variables, Actions)"; missing=1; fi
          done
          CLEAN=$(printf '%s' "$CERTS_REPO_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN"
          echo "CLEAN_CERTS_TOKEN=$CLEAN" >> "$GITHUB_ENV"
          exit $missing

      - name: Get key files from ios-certificates
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: belgarath534/ios-certificates
          token: ${{ env.CLEAN_CERTS_TOKEN }}
          path: .certs-repo

      - name: Collect Apple API keys
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.asc/candidates"
          if [ -d .certs-repo ]; then
            find .certs-repo -name '*.p8' -not -path '*/.git/*' -exec cp {} "$HOME/.asc/candidates/" \;
          fi
          if [ -n "$ASC_KEY_P8" ] && [ -n "$ASC_KEY_ID" ]; then
            printf '%s\n' "$ASC_KEY_P8" > "$HOME/.asc/candidates/secret_$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]').p8"
          fi
          rm -rf .certs-repo
          echo "Keys found: $(ls "$HOME/.asc/candidates" | tr '\n' ' ')"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Find the key Apple accepts
        run: ruby scripts/check_asc_key.rb

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build, sign and upload to TestFlight
        run: bundle exec fastlane beta

      - name: Remove keys
        if: always()
        run: rm -rf "$HOME/.asc"
