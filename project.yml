# Hallway 24. The .xcodeproj is generated from this by XcodeGen (on GitHub's Mac runners).
name: Hallway24
options:
  bundleIdPrefix: com.hallway24
  deploymentTarget:
    iOS: "17.0"
packages:
  HallwayCore:
    path: Packages/HallwayCore
targets:
  Hallway24:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/*.md"
    dependencies:
      - package: HallwayCore
    entitlements:
      path: App/Hallway24.entitlements
      properties:
        com.apple.developer.game-center: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hallway 24
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        # 3D sound: with AirPods, sounds stay in place when you turn your head.
        NSMotionUsageDescription: "With AirPods, Hallway 24 follows how you turn your head so the creatures' sounds stay in place around you. Com AirPods, o Hallway 24 acompanha sua cabeça para os sons das criaturas ficarem no lugar."

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hallway24.Hallway24
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}
